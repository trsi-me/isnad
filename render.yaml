# https://render.com/docs/blueprint-spec
# نشر static لـ Flutter Web
# تشغيل محلي: deploy/copy_web.ps1  (يبني ثم ينسخ) أو copy_web.ps1 -SkipBuild لو بُني مسبقاً
# ليستبدل الموقع على Render: نفّذ copy_web.ps1 -Push  أو ادفع يدوياً بعد النسخ

services:
  - type: web
    name: isnad-web
    runtime: static
    rootDir: .
    # فشل واضح إن نسيت نسخ مخرجات البناء
    buildCommand: test -f deploy/web/index.html && test -f deploy/web/flutter_bootstrap.js
    staticPublishPath: deploy/web
    indexDocument: index.html
    # منع 404 عند فتح رابط مباشر (مثلاً /login) — يعيد index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
